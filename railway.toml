# Railway config-as-code: build and run the server only.
# If build still fails with TS6059/shared, set env NO_CACHE=1 and redeploy once.

[build]
builder = "railpack"
buildCommand = "npm run build:server"

[deploy]
startCommand = "cd server && npm start"
healthcheckPath = "/health"
healthcheckTimeout = 30
